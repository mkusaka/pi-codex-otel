name: workflow-lint

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/scripts/**"
      - ".pinact.yaml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  jactionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download jactionlint
        env:
          # renovate: datasource=github-releases depName=jdx/jactionlint
          JACTIONLINT_VERSION: v2.3.0
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          archive="jactionlint_${JACTIONLINT_VERSION#v}_linux_amd64.tar.gz"
          curl -sSfL -H "Authorization: token $GITHUB_TOKEN" -o "/tmp/$archive" "https://github.com/jdx/jactionlint/releases/download/$JACTIONLINT_VERSION/$archive"
          curl -sSfL -H "Authorization: token $GITHUB_TOKEN" -o /tmp/jactionlint_checksums.txt "https://github.com/jdx/jactionlint/releases/download/$JACTIONLINT_VERSION/jactionlint_${JACTIONLINT_VERSION#v}_checksums.txt"
          (cd /tmp && grep "  $archive\$" jactionlint_checksums.txt | sha256sum -c -)
          tar -xzf "/tmp/$archive" -C /tmp jactionlint
          sudo install -m 0755 /tmp/jactionlint /usr/local/bin/jactionlint
          jactionlint --version
        shell: bash
      - name: Check workflow files
        run: jactionlint --color
        shell: bash

  ghalint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download ghalint
        env:
          GHALINT_VERSION: v1.5.6
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          archive="ghalint_${GHALINT_VERSION#v}_linux_amd64.tar.gz"
          curl -sSfL -H "Authorization: token $GITHUB_TOKEN" -o "/tmp/$archive" "https://github.com/suzuki-shunsuke/ghalint/releases/download/$GHALINT_VERSION/$archive"
          curl -sSfL -H "Authorization: token $GITHUB_TOKEN" -o /tmp/ghalint_checksums.txt "https://github.com/suzuki-shunsuke/ghalint/releases/download/$GHALINT_VERSION/ghalint_${GHALINT_VERSION#v}_checksums.txt"
          (cd /tmp && grep "  $archive$" ghalint_checksums.txt | sha256sum -c -)
          tar -xzf "/tmp/$archive" -C /tmp
          sudo install -m 0755 /tmp/ghalint /usr/local/bin/ghalint
      - name: Check workflow files
        run: ghalint run

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor security check
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          inputs: .github/workflows/
          min-severity: medium
          token: ${{ github.token }}
          advanced-security: false
          annotations: true
          version: v1.30.0

  pinact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download pinact
        env:
          PINACT_VERSION: v4.1.1
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          archive="pinact_linux_amd64.tar.gz"
          curl -sSfL -H "Authorization: token $GITHUB_TOKEN" -o "/tmp/$archive" "https://github.com/suzuki-shunsuke/pinact/releases/download/$PINACT_VERSION/$archive"
          curl -sSfL -H "Authorization: token $GITHUB_TOKEN" -o /tmp/pinact_checksums.txt "https://github.com/suzuki-shunsuke/pinact/releases/download/$PINACT_VERSION/pinact_${PINACT_VERSION#v}_checksums.txt"
          (cd /tmp && grep "  $archive$" pinact_checksums.txt | sha256sum -c -)
          tar -xzf "/tmp/$archive" -C /tmp
          sudo install -m 0755 /tmp/pinact /usr/local/bin/pinact
      - name: Check pinned action refs
        run: pinact run --check
